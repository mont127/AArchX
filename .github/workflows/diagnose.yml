# A one-off probe of the xcode-27 runner, run when this file changes on the
# working branch and deleted once its output has been read. The native Swift
# suite failed once, in the interpreter run of native_dispatch_time, on the line
# for a walltime deadline: the wait took less than 23 ms or more than 150 ms
# where 25 ms was asked for. This repeats that wait many times natively as
# arm64 and as x86-64 under ocerz in native mode, translated and interpreted,
# and prints every wait that falls outside the test's bounds with the interval
# between taking the walltime and starting the wait, then repeats the real test
# and counts the runs whose output differs from a native run's.

name: diagnose

on:
  push:
    branches: [claude/wonderful-mendel-3mhhcq]
    paths: [.github/workflows/diagnose.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build ocerz and the API databases
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || echo "rosetta did not install"
          make -j"$(sysctl -n hw.logicalcpu)" ocerz apis

      - name: The walltime wait, repeated
        run: |
          cat > /tmp/dprobe.c <<'EOF'
          #include <dispatch/dispatch.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <sys/time.h>
          #include <time.h>
          static unsigned long long up_us(void) { return clock_gettime_nsec_np(CLOCK_UPTIME_RAW) / 1000; }
          static unsigned long long wall_us(void)
          {
              struct timeval tv;
              gettimeofday(&tv, 0);
              return (unsigned long long)tv.tv_sec * 1000000ULL + (unsigned long long)tv.tv_usec;
          }
          static int cmp(const void *a, const void *b)
          {
              long x = *(const long *)a, y = *(const long *)b;
              return x < y ? -1 : x > y;
          }
          int main(int argc, char **argv)
          {
              int n = argc > 1 ? atoi(argv[1]) : 200;
              long *el = malloc(sizeof(long) * (size_t)n);
              long *sorted = malloc(sizeof(long) * (size_t)n);
              dispatch_semaphore_t s = dispatch_semaphore_create(0);
              int out = 0, early = 0, late = 0;
              long wmin = 1L << 40, wmax = 0;
              for (int i = 0; i < n; i++) {
                  unsigned long long g0 = up_us();
                  dispatch_time_t w = dispatch_walltime(NULL, 0);
                  unsigned long long t0 = up_us();
                  unsigned long long w0 = wall_us();
                  dispatch_semaphore_wait(s, dispatch_time(w, 25 * NSEC_PER_MSEC));
                  unsigned long long t1 = up_us();
                  unsigned long long w1 = wall_us();
                  long e = (long)(t1 - t0);
                  long we = (long)(w1 - w0);
                  el[i] = e;
                  if (we < wmin) wmin = we;
                  if (we > wmax) wmax = we;
                  if (e + 2000 < 25000 || e > 150000) {
                      out++;
                      if (e < 25000) early++; else late++;
                      if (out <= 12)
                          printf("  run %d outside: uptime elapsed %ld us, wall elapsed %ld us, walltime-to-wait gap %ld us\n", i, e, we, (long)(t0 - g0));
                  }
                  sorted[i] = e;
              }
              qsort(sorted, (size_t)n, sizeof(long), cmp);
              printf("n=%d outside=%d (early %d, late %d)  uptime elapsed us: min=%ld median=%ld p99=%ld max=%ld | wall elapsed us: min=%ld max=%ld\n",
                     n, out, early, late, sorted[0], sorted[n / 2], sorted[(n * 99) / 100], sorted[n - 1], wmin, wmax);
              return 0;
          }
          EOF
          clang -arch arm64 -O1 -o /tmp/dprobe_a64 /tmp/dprobe.c
          clang -arch x86_64 -O1 -o /tmp/dprobe_x64 /tmp/dprobe.c
          echo "=== native arm64";                 /tmp/dprobe_a64 300
          echo "=== ocerz -native, translated";    ./ocerz -native /tmp/dprobe_x64 300
          echo "=== ocerz -native, interpreted";   ./ocerz -native -no-jit /tmp/dprobe_x64 300

      - name: The real test, repeated
        run: |
          clang -arch arm64 -O1 tests/dynamic/native_dispatch_time.c -o /tmp/ndt_a64
          clang -arch x86_64 -O1 tests/dynamic/native_dispatch_time.c -o /tmp/ndt_x64
          /tmp/ndt_a64 > /tmp/ndt.expected
          cat /tmp/ndt.expected
          count() {
            label="$1"; shift
            bad=0
            for i in $(seq 1 40); do
              "$@" > /tmp/ndt.out 2>/dev/null || true
              if ! cmp -s /tmp/ndt.expected /tmp/ndt.out; then
                bad=$((bad + 1))
                if [ "$bad" -le 3 ]; then echo "  $label run $i differs:"; diff /tmp/ndt.expected /tmp/ndt.out | sed 's/^/    /'; fi
              fi
            done
            echo "$label: $bad of 40 runs differ from the first native run"
          }
          count "native arm64" /tmp/ndt_a64
          count "ocerz -native, translated" ./ocerz -native /tmp/ndt_x64
          count "ocerz -native, interpreted" ./ocerz -native -no-jit /tmp/ndt_x64
