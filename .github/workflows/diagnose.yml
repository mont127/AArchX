# A one-off probe of the xcode-27 runner, run when this file changes on the
# working branch and deleted once its output has been read. It answers two
# questions about the dynamic cases that failed there: why ntp_gettime returns
# EIO, and why the Metal compute case reads back wrong data. Each probe runs
# natively as arm64 and again as x86-64 under ocerz, so a difference between the
# two says the translator is at fault and agreement says the machine is.

name: diagnose

on:
  push:
    branches: [claude/wonderful-mendel-3mhhcq]
    paths: [.github/workflows/diagnose.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The machine
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.model hw.ncpu hw.memsize
          echo "kern.hv_vmm_present=$(sysctl -n kern.hv_vmm_present)"
          system_profiler SPDisplaysDataType SPHardwareDataType 2>&1 | head -60

      - name: Install Rosetta and build ocerz
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || echo "rosetta did not install"
          make -j"$(sysctl -n hw.logicalcpu)" ocerz

      - name: ntp_gettime and ntp_adjtime, natively and under ocerz
        run: |
          cat > /tmp/ntp.c <<'EOF'
          #include <errno.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/syscall.h>
          #include <sys/timex.h>
          #include <unistd.h>
          int main(void)
          {
              struct ntptimeval t;
              memset(&t, 0, sizeof t);
              errno = 0;
              int r = ntp_gettime(&t);
              printf("ntp_gettime:  ret=%d errno=%d (%s) maxerror=%ld esterror=%ld\n", r, errno, errno ? strerror(errno) : "-", (long)t.maxerror, (long)t.esterror);
              memset(&t, 0, sizeof t);
              errno = 0;
              long s = syscall(528, &t);
              printf("syscall(528): ret=%ld errno=%d (%s)\n", s, errno, errno ? strerror(errno) : "-");
              struct timex x;
              memset(&x, 0, sizeof x);
              errno = 0;
              r = ntp_adjtime(&x);
              printf("ntp_adjtime:  ret=%d errno=%d (%s) status=%#x\n", r, errno, errno ? strerror(errno) : "-", (unsigned)x.status);
              return 0;
          }
          EOF
          clang -arch arm64 -o /tmp/ntp_a64 /tmp/ntp.c
          clang -arch x86_64 -o /tmp/ntp_x64 /tmp/ntp.c
          echo "--- native arm64";            /tmp/ntp_a64 || true
          echo "--- ocerz, translated";       ./ocerz /tmp/ntp_x64 || true
          echo "--- ocerz, interpreted";      ./ocerz -no-jit /tmp/ntp_x64 || true
          echo "--- ocerz -strace, the ntp lines"; ./ocerz -strace /tmp/ntp_x64 2>&1 | grep -i -E "ntp|ret=|errno" || true

      - name: Metal compute, natively and under ocerz
        run: |
          cat > /tmp/mprobe.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/mman.h>

          static void probe(id<MTLDevice> dev, const char *label, int mode)
          {
              @autoreleasepool {
                  size_t len = 0x10000;
                  size_t n = len / sizeof(float);
                  float *mem = mmap((void *)0x240000000, len + 0x10000, PROT_READ | PROT_WRITE,
                                    MAP_PRIVATE | MAP_ANON | MAP_FIXED, -1, 0);
                  if (mem == MAP_FAILED) {
                      printf("%s: mmap failed\n", label);
                      return;
                  }
                  for (size_t i = 0; i < n; i++)
                      mem[i] = (float)i + 1000.0f;
                  NSError *err = nil;
                  id<MTLLibrary> lib = [dev newLibraryWithSource:@"kernel void k(device const float *in [[buffer(0)]], device float *out [[buffer(1)]], uint i [[thread_position_in_grid]]) { out[i] = in[i] * 2.0f; }" options:nil error:&err];
                  if (!lib) {
                      printf("%s: newLibrary failed: %s\n", label, err.localizedDescription.UTF8String);
                      return;
                  }
                  id<MTLComputePipelineState> ps = [dev newComputePipelineStateWithFunction:[lib newFunctionWithName:@"k"] error:&err];
                  if (!ps) {
                      printf("%s: pipeline failed: %s\n", label, err.localizedDescription.UTF8String);
                      return;
                  }
                  id<MTLBuffer> in = nil;
                  if (mode == 0) {
                      in = [dev newBufferWithBytesNoCopy:mem length:len options:MTLResourceStorageModeShared deallocator:nil];
                  } else if (mode == 1) {
                      in = [dev newBufferWithBytes:mem length:len options:MTLResourceStorageModeShared];
                  } else {
                      in = [dev newBufferWithLength:len options:MTLResourceStorageModeShared];
                      memcpy([in contents], mem, len);
                  }
                  id<MTLBuffer> out = [dev newBufferWithLength:len options:MTLResourceStorageModeShared];
                  if (!in || !out) {
                      printf("%s: buffer creation failed (in=%d out=%d)\n", label, in != nil, out != nil);
                      return;
                  }
                  memset([out contents], 0x55, len);
                  id<MTLCommandBuffer> cb = [[dev newCommandQueue] commandBuffer];
                  id<MTLComputeCommandEncoder> e = [cb computeCommandEncoder];
                  [e setComputePipelineState:ps];
                  [e setBuffer:in offset:0 atIndex:0];
                  [e setBuffer:out offset:0 atIndex:1];
                  [e dispatchThreads:MTLSizeMake(n, 1, 1) threadsPerThreadgroup:MTLSizeMake(64, 1, 1)];
                  [e endEncoding];
                  [cb commit];
                  [cb waitUntilCompleted];
                  const float *o = [out contents];
                  size_t bad = 0, zero = 0, untouched = 0;
                  for (size_t i = 0; i < n; i++) {
                      uint32_t w;
                      memcpy(&w, &o[i], 4);
                      if (o[i] != 2.0f * ((float)i + 1000.0f))
                          bad++;
                      if (w == 0)
                          zero++;
                      if (w == 0x55555555u)
                          untouched++;
                  }
                  printf("%s: status=%ld error=%s wrong=%zu/%zu zeros=%zu untouched=%zu first=[%g %g %g] want=[2000 2002 2004]\n",
                         label, (long)cb.status, cb.error ? cb.error.localizedDescription.UTF8String : "none",
                         bad, n, zero, untouched, o[0], o[1], o[2]);
                  munmap(mem, len + 0x10000);
              }
          }

          int main(void)
          {
              @autoreleasepool {
                  NSArray<id<MTLDevice>> *all = MTLCopyAllDevices();
                  printf("Metal devices: %lu\n", (unsigned long)all.count);
                  for (id<MTLDevice> d in all)
                      printf("  %s unified=%d lowPower=%d\n", d.name.UTF8String, (int)d.hasUnifiedMemory, (int)d.lowPower);
                  id<MTLDevice> dev = MTLCreateSystemDefaultDevice();
                  if (!dev) {
                      printf("default device: none\n");
                      return 0;
                  }
                  printf("default device: %s\n", dev.name.UTF8String);
                  probe(dev, "bytesNoCopy, what the test does", 0);
                  probe(dev, "bytes, copied in", 1);
                  probe(dev, "newBufferWithLength then memcpy", 2);
              }
              return 0;
          }
          EOF
          clang -arch arm64 -fobjc-arc -framework Metal -framework Foundation -o /tmp/mprobe_a64 /tmp/mprobe.m
          clang -arch x86_64 -fobjc-arc -framework Metal -framework Foundation -o /tmp/mprobe_x64 /tmp/mprobe.m \
            -Wl,-no_pie -Wl,-pagezero_size,0x1000 -Wl,-image_base,0x200000000
          echo "=== native arm64";       /tmp/mprobe_a64 || echo "exit=$?"
          echo "=== ocerz, translated";  ./ocerz /tmp/mprobe_x64 || echo "exit=$?"
          echo "=== ocerz, interpreted"; ./ocerz -no-jit /tmp/mprobe_x64 || echo "exit=$?"

      - name: The real Metal case, natively and under ocerz
        run: |
          clang -arch arm64 -fobjc-arc -framework Metal -framework Foundation -o /tmp/real_a64 tests/dynamic/metal_nocopy_low.m
          clang -arch x86_64 -fobjc-arc -framework Metal -framework Foundation -o /tmp/real_x64 tests/dynamic/metal_nocopy_low.m \
            -Wl,-no_pie -Wl,-pagezero_size,0x1000 -Wl,-image_base,0x200000000
          echo "=== native arm64";      /tmp/real_a64; echo "exit=$?"
          echo "=== ocerz, translated"; ./ocerz /tmp/real_x64; echo "exit=$?"
