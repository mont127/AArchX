# A one-off probe of the xcode-27 runner, run when this file changes on the
# working branch and deleted once its output has been read. The native Swift
# suite failed native_dispatch_time twice, both times in the interpreter pass
# and never in the translated one, and a probe of the walltime wait alone found
# no difference between the engines. This runs the real test 40 times with the
# native build, the translated run and the interpreted run one after another in
# each round, so that the time at which a run happens cannot favour an engine,
# and counts, per engine, the rounds in which any line of the test reports a
# wait outside its bounds and which lines they were.

name: diagnose

on:
  push:
    branches: [claude/wonderful-mendel-3mhhcq]
    paths: [.github/workflows/diagnose.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build ocerz and the API databases
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || echo "rosetta did not install"
          make -j"$(sysctl -n hw.logicalcpu)" ocerz apis

      - name: The real test, the three engines in turn
        run: |
          clang -arch arm64 -O1 tests/dynamic/native_dispatch_time.c -o /tmp/ndt_a64
          clang -arch x86_64 -O1 tests/dynamic/native_dispatch_time.c -o /tmp/ndt_x64
          : > /tmp/bad_rounds
          : > /tmp/bad_lines
          rounds=40
          for i in $(seq 1 $rounds); do
            /tmp/ndt_a64 > /tmp/o.native || true
            ./ocerz -native /tmp/ndt_x64 > /tmp/o.translated 2>/dev/null || true
            ./ocerz -native -no-jit /tmp/ndt_x64 > /tmp/o.interpreted 2>/dev/null || true
            for e in native translated interpreted; do
              if grep -q '=0$' /tmp/o.$e; then
                echo "$e" >> /tmp/bad_rounds
                grep '=0$' /tmp/o.$e | sed "s/ r=.*//; s/^/$e: /" >> /tmp/bad_lines
              fi
            done
          done
          echo "rounds in which some line reported a wait outside its bounds, out of $rounds:"
          for e in native translated interpreted; do
            printf '  %-12s %s\n' "$e" "$(grep -c "^$e\$" /tmp/bad_rounds || true)"
          done
          echo "which lines:"
          sort /tmp/bad_lines | uniq -c | sort -rn | sed 's/^/  /'
          echo "a complete output for reference:"
          sed 's/^/  /' /tmp/o.native
