# A one-off probe of the xcode-27 runner, run when this file changes on the
# working branch and deleted once its output has been read. The native suite
# failed attach_apply once, in the translated run, with bit 7 of the fixture's
# own checks set: every one of the 384 iterations of dispatch_apply_f ran on
# the calling thread, so no worker joined and nothing was tested. The fixture
# is plain C with no x86 dependency, so it is built here for arm64 as well and
# run natively as the control. Each of 100 rounds runs the native build, then
# the x86-64 build under ocerz in native mode translated and then interpreted,
# so the time of a run cannot favour an engine, and the probe counts the runs
# whose checks failed and how many threads took part in each engine.

name: diagnose

on:
  push:
    branches: [claude/wonderful-mendel-3mhhcq]
    paths: [.github/workflows/diagnose.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build ocerz and the API databases
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || echo "rosetta did not install"
          make -j"$(sysctl -n hw.logicalcpu)" ocerz apis

      - name: Extract and build the real fixture
        run: |
          mkdir -p /tmp/fx
          python3 - <<'PY'
          import re
          s = open('tests/run_native_tests.sh').read()
          for name in ('cb_common.h', 'attach_common.h', 'attach_apply.c'):
              ms = re.findall(r'cat > "\$TMP/' + re.escape(name) + r"\" <<'EOC'\n(.*?)\nEOC\n", s, re.S)
              assert len(ms) == 1, (name, len(ms))
              open('/tmp/fx/' + name, 'w').write(ms[0] + '\n')
          PY
          cd /tmp/fx
          clang -arch x86_64 -std=c11 -O1 -fno-builtin -fno-stack-protector -o attach_apply_x64 attach_apply.c
          clang -arch arm64 -std=c11 -O1 -fno-builtin -fno-stack-protector -o attach_apply_a64 attach_apply.c
          ls -la attach_apply_x64 attach_apply_a64

      - name: The fixture, the three engines in turn
        run: |
          cd /tmp/fx
          rounds=100
          for e in native translated interpreted; do : > out.$e; : > thr.$e; done
          for i in $(seq 1 $rounds); do
            ./attach_apply_a64 > o.native 2> e.native || true
            "$GITHUB_WORKSPACE/ocerz" -native ./attach_apply_x64 > o.translated 2> e.translated || true
            "$GITHUB_WORKSPACE/ocerz" -native -no-jit ./attach_apply_x64 > o.interpreted 2> e.interpreted || true
            for e in native translated interpreted; do
              head -1 o.$e | sed 's/ n=.*//' >> out.$e
              grep -h '^attach_apply: threads=' e.$e | head -1 | sed 's/^attach_apply: //' >> thr.$e || true
            done
          done
          echo "results of the fixture's own checks over $rounds rounds:"
          for e in native translated interpreted; do
            echo "  $e:"
            sort out.$e | uniq -c | sed 's/^/    /'
          done
          echo "threads that took part (and whether the calling thread was one):"
          for e in native translated interpreted; do
            echo "  $e:"
            sort thr.$e | uniq -c | sort -rn | head -8 | sed 's/^/    /'
          done
