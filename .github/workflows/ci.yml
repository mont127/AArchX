# Runs the repository's own gates on every commit pushed to any branch, and on
# pull requests from forks, whose pushes never reach this repository's runs.
# A pull request from a branch of this repository is not run a second time: its
# commits were already checked by the push that created them, and the check on
# the head commit is the same one the pull request shows.
#
# AArchX emits arm64 code and links the macOS SDK, so nothing here can run on
# Linux or on an Intel Mac. Both jobs use `xcode-27`, GitHub's Apple silicon
# image for macOS 27 with Xcode 27, which is in public preview. The `macos-26`
# image carries SDK 26.5, and on that `make apis` stops at a header only SDK 27
# has, while test_apidb reads runtime/apis/macos/27.0, a directory only a run
# against SDK 27 writes.
#
# There are two jobs, and they run side by side. `unit` builds ocerz, generates
# the native-mode API databases and runs the unit harnesses, which takes a few
# minutes and tells a contributor at once whether the tree still builds and the
# translator's components still agree with their own checks. `check` is
# `make check`, the gate that CONTRIBUTING.md says must be green before a change
# is sent, taken one phase per step in the order its recipe runs them. A phase
# that fails does not stop the ones after it, so one run says which of them
# pass; a build that fails stops them all. The `phases` step fails the job when
# the recipe in the Makefile names a phase this file does not run, so the two
# cannot drift apart without a run saying so.
#
# `make check` builds first and tests second. The build is done here with all
# the cores, then every phase finds everything up to date, because the dynamic
# suite is timing-sensitive under load and must not share the machine with a
# build.
#
# A hosted runner is a three-core virtual machine whose clock is never
# synchronised, so its kernel fails ntp_gettime with EIO, natively and under
# ocerz alike. The dynamic runner builds the cases that depend on such things
# natively as well and skips one, saying so, when the machine's own run of it
# fails, so what is skipped is what the machine cannot do and a failure that
# only ocerz shows still fails. The slower machine also gets a longer limit for
# each dynamic case, 120 seconds against the 30 it has by default.
#
# Rosetta is installed on the runner because the dynamic and native gates bind
# guest programs against the x86-64 shared cache that its package ships;
# AArchX maps that file and never runs Rosetta's translator. A gate whose
# prerequisites are missing prints SKIP and exits zero rather than failing, so
# the `check` job lists every SKIP line it saw as a warning on the run and in
# its summary; a run that is green with skips has not exercised those gates.
# The i386 conformance report against capstone is a progress measure, not a
# gate, and is not part of `make check`, so it is not run here.
#
# Each commit gets its own runs and nothing is cancelled when a newer commit
# arrives, because the point is a verdict for every commit, not only the last.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OCERZ_TCACHE: "off"

jobs:
  unit:
    name: build and unit harnesses
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -showsdks
          xcrun --show-sdk-version
          clang --version

      - name: Build ocerz
        run: make -j"$(sysctl -n hw.logicalcpu)" ocerz

      - name: Print the version
        run: ./ocerz version

      - name: Generate the API databases
        run: make apis

      - name: Unit harnesses
        run: make unit

  check:
    name: make check, phase by phase
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      OCERZ_DYNAMIC_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4

      - name: The phases are the ones make check runs
        run: |
          missing=0
          while IFS= read -r cmd; do
            if ! grep -qF "run: $cmd 2>&1" .github/workflows/ci.yml; then
              echo "::error::make check runs '$cmd' and ci.yml does not"
              missing=1
            fi
          done < <(awk '/^check:/ { f = 1; next } f && /^\t/ { sub(/^\t/, ""); print; next } f { exit }' Makefile | grep '^bash ')
          exit $missing

      - name: Show the toolchain
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          xcode-select -p
          xcodebuild -showsdks
          xcrun --show-sdk-version
          clang --version

      - name: Install Rosetta
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || echo "::warning::Rosetta did not install; the gates that need the x86-64 shared cache will skip"

      - name: Build ocerz, the guest tests and the API databases
        id: build
        run: make -j"$(sysctl -n hw.logicalcpu)" ocerz guest apis

      - name: Unit harnesses
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: make unit 2>&1 | tee -a check.log

      - name: Guest suite, interpreted
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_guest_tests.sh --no-jit 2>&1 | tee -a check.log

      - name: Guest suite, translated
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_guest_tests.sh 2>&1 | tee -a check.log

      - name: x86-64 differential
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_diff_test.sh 2>&1 | tee -a check.log

      - name: i386 differential
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_diff32.sh . 2>&1 | tee -a check.log

      - name: Dynamic suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_dynamic_tests.sh 2>&1 | tee -a check.log

      - name: Native suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_native_tests.sh 2>&1 | tee -a check.log

      - name: Guest library suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_guest_library_tests.sh 2>&1 | tee -a check.log

      - name: Native C++ suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_native_cxx_tests.sh 2>&1 | tee -a check.log

      - name: Native framework suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_native_framework_tests.sh 2>&1 | tee -a check.log

      - name: Native format suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_native_format_tests.sh 2>&1 | tee -a check.log

      - name: Native Swift suite
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: bash tests/run_native_swift_tests.sh 2>&1 | tee -a check.log

      - name: Report skipped gates
        if: always()
        run: |
          [ -f check.log ] || exit 0
          skips=$(grep -E '(^|[^A-Za-z])SKIP' check.log | sort -u || true)
          [ -n "$skips" ] || exit 0
          {
            echo "### Skipped gates"
            echo
            echo '```'
            echo "$skips"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$skips" | while IFS= read -r line; do echo "::warning::$line"; done
